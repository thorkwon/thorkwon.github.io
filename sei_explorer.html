<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Dashcam SEI Explorer</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #ffffff;
            --bg-panel: #f5f5f5;
            --text: #1a1a1a;
            --text-muted: #666666;
            --accent: #0080ff;
            --accent-hover: #0099ff;
            --border: #888888;
            --drop-hover-bg: #e8f4ff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a1a;
                --bg-panel: #252525;
                --text: #e8e8e8;
                --text-muted: #999999;
                --accent: rgb(255, 0, 51);
                --accent-hover: rgb(200, 0, 40);
                --border: #666666;
                --drop-hover-bg: #291818;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.4;
        }

        a {
            color: var(--accent);
        }

        /* ===== APP SHELL ===== */
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 1rem;
            gap: 0.75rem;
        }

        /* Header - fixed height */
        .header {
            flex-shrink: 0;
        }

        .header .nav {
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
        }

        .header h1 {
            font-size: 1.4rem;
            margin-bottom: 0.125rem;
        }

        /* Main content - fills remaining space */
        .main {
            flex: 1;
            min-height: 0;
            /* Critical for flex children to shrink */
            display: flex;
            gap: 1rem;
        }

        /* ===== COLUMN LAYOUT (default: wide screens) ===== */
        /* Left: Video + Controls */
        .video-section {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* Right: Metadata + Export */
        .meta-section {
            width: 155px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        /* ===== VIDEO AREA ===== */
        .video-wrap {
            flex: 1;
            min-height: 0;
            background: #000;
            border-radius: 8px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-wrap canvas {
            max-width: 100%;
            max-height: 100%;
        }

        /* Drop overlay */
        .drop-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-panel);
            border: 2px dashed var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        .drop-overlay.hidden {
            display: none;
        }

        .drop-overlay:hover,
        .drop-overlay.dragover {
            background: var(--drop-hover-bg);
            border-color: var(--accent);
        }

        .drop-overlay p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .drop-overlay input {
            display: none;
        }

        /* ===== SCRUBBER ===== */
        .scrubber {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: var(--bg-panel);
            border-radius: 6px;
            height: 44px;
        }

        .scrubber button {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, opacity 0.15s;
        }

        .scrubber button:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .scrubber button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .scrubber button svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .scrubber input[type="range"] {
            flex: 1;
            height: 4px;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            padding: 12px 0;
            margin: -12px 0;
        }

        .scrubber input[type="range"]::-webkit-slider-runnable-track {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
        }

        .scrubber input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent);
            border-radius: 50%;
            margin-top: -5px;
            cursor: pointer;
        }

        .scrubber input[type="range"]::-moz-range-track {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
        }

        .scrubber input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: var(--accent);
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }

        .scrubber input[type="range"]:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== STATS OVERLAY ===== */
        .stats-overlay {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            grid-template-columns: 28px 28px 1fr 28px 28px;
            grid-template-rows: 28px 28px;
            gap: 6px;
            padding: 8px 12px;
            background: #000;
            color: #fff;
            border-radius: 12px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05), 0 0 20px rgba(0, 0, 0, 0.3);
            user-select: none;
        }

        .stats-overlay.visible {
            display: grid;
        }

        .stats-overlay svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        .stats-overlay .speed {
            grid-column: 3;
            grid-row: 1 / 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 70px;
        }

        .stats-overlay .speed-click {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .stats-overlay .speed-val {
            font-size: 32px;
            font-weight: 700;
            line-height: 1;
        }

        .stats-overlay .speed-unit {
            font-size: 11px;
            opacity: 0.7;
        }

        .stats-overlay .autopilot {
            font-size: 9px;
            font-weight: 650;
            color: #00e5ff;
            margin-bottom: 2px;
            white-space: nowrap;
            display: none;
        }

        .stats-overlay .autopilot.active {
            display: block;
        }

        .stats-overlay .blinker {
            display: none;
            transition: opacity 0.1s;
        }

        .stats-overlay .blinker.active {
            display: flex;
        }

        .stats-overlay .blinker.dim {
            opacity: 0.35;
        }

        .stats-overlay .blinker circle {
            fill: rgb(80, 186, 69);
            stroke: none;
        }

        .stats-overlay .accel-fill {
            fill: rgba(84, 209, 71, 0.7);
        }

        .stats-overlay .brake.applied .brake-fill {
            fill: rgba(233, 146, 75, 0.7);
        }

        .stats-overlay .gear {
            grid-column: 1;
            grid-row: 1;
        }

        .stats-overlay .brake {
            grid-column: 1;
            grid-row: 2;
        }

        .stats-overlay .steering {
            grid-column: 5;
            grid-row: 1;
        }

        .stats-overlay .accel {
            grid-column: 5;
            grid-row: 2;
        }

        .stats-overlay .blinker-l {
            grid-column: 2;
            grid-row: 1 / 3;
            align-items: center;
            justify-content: center;
        }

        .stats-overlay .blinker-r {
            grid-column: 4;
            grid-row: 1 / 3;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 600px) {
            .stats-overlay {
                top: 5px;
                grid-template-columns: 20px 20px 1fr 20px 20px;
                grid-template-rows: 20px 20px;
                gap: 4px;
                padding: 6px 8px;
                border-radius: 8px;
                border-width: 2px;
            }

            .stats-overlay svg {
                width: 20px;
                height: 20px;
            }

            .stats-overlay .speed-val {
                font-size: 22px;
            }

            .stats-overlay .speed-unit {
                font-size: 9px;
            }

            .stats-overlay .speed {
                min-width: 50px;
            }
        }

        /* ===== METADATA PANEL ===== */
        .meta-panel {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg-panel);
            border-radius: 6px;
            overflow: hidden;
            padding-bottom: 3px;
        }

        .meta-header {
            flex-shrink: 0;
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        .meta-header .filename {
            font-weight: 600;
            font-size: 0.75rem;
            word-break: break-all;
        }

        .meta-header .framenum {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .meta-header .framenum, .meta-header .recording-time {
            border-top: 1px solid var(--border);
            margin-top: 0.4rem;
            padding-top: 0.4rem;
        }

        .meta-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.375rem;
            font-size: 0.8rem;
            font-variant-numeric: tabular-nums;
        }

        .meta-list .item {
            display: flex;
            flex-direction: column;
        }

        .meta-list .label {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .meta-list .value {
            font-weight: 600;
            color: var(--accent);
        }

        /* Export button */
        .export-btn {
            flex-shrink: 0;
            height: 44px;
            padding: 0 0.75rem;
            border: none;
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, opacity 0.15s;
        }

        .export-btn:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .export-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== ROW LAYOUT (short/narrow screens) ===== */
        @media (max-height: 600px),
        (max-width: 600px) {
            .main {
                flex-direction: column;
            }

            .video-section {
                flex: none;
            }

            .video-wrap {
                flex: none;
                min-height: 200px;
                max-height: 40vh;
            }

            .meta-section {
                width: auto;
                flex: 1;
                min-height: 120px;
            }

            .meta-panel {
                flex: 1;
                min-height: 300px;
            }

            .meta-list {
                flex-direction: row;
                flex-wrap: wrap;
                /* gap: 0.5rem; */
            }

            .meta-list .item {
                min-width: 90px;
                flex: 1;
            }
        }
    </style>
    <link rel="stylesheet" href="viewer.css">
</head>

<body>
    <div class="app">
        <header class="header">
            <h1>Tesla Dashcam SEI Explorer</h1>
        </header>

        <main class="main">
            <section class="video-section">
                <div class="video-wrap">
                    <div class="drop-overlay" id="dropOverlay">
                        <input type="file" id="fileInput" accept="video/mp4" multiple>
                        <input type="file" id="folderInput" webkitdirectory multiple>
                        <p>Drop MP4 here or click to select</p>
                    </div>
                    <canvas id="canvas"></canvas>
                    <div class="stats-overlay" id="statsOverlay">
                        <div class="blinker blinker-l">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="9" />
                                <g transform="translate(4.5, 4.5) scale(0.625)">
                                    <path
                                        d="M13 9a1 1 0 0 1-1-1V5.061a1 1 0 0 0-1.811-.75l-6.835 6.836a1.207 1.207 0 0 0 0 1.707l6.835 6.835a1 1 0 0 0 1.811-.75V16a1 1 0 0 1 1-1h6a1 1 0 0 0 1-1v-4a1 1 0 0 0-1-1z"
                                        fill="currentColor" />
                                </g>
                            </svg>
                        </div>
                        <div class="gear">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" />
                                <text x="12" y="16" text-anchor="middle" font-size="10" font-weight="700"
                                    fill="currentColor" id="gearText">P</text>
                            </svg>
                        </div>
                        <div class="speed">
                            <span class="autopilot" id="autopilot"></span>
                            <span class="speed-click">
                                <span class="speed-val" id="speedVal">0</span>
                                <span class="speed-unit">km/h</span>
                            </span>
                        </div>
                        <div class="steering">
                            <svg viewBox="0 0 24 24" id="steeringSvg">
                                <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" />
                                <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2" />
                                <circle cx="12" cy="12" r="2" fill="currentColor" />
                                <line x1="7" y1="12" x2="17" y2="12" stroke="currentColor" stroke-width="2" />
                                <line x1="12" y1="12" x2="12" y2="17" stroke="currentColor" stroke-width="2" />
                            </svg>
                        </div>
                        <div class="blinker blinker-r">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="9" />
                                <g transform="translate(4.5, 4.5) scale(0.625)">
                                    <path
                                        d="M11 9a1 1 0 0 0 1-1V5.061a1 1 0 0 1 1.811-.75l6.836 6.836a1.207 1.207 0 0 1 0 1.707l-6.836 6.835a1 1 0 0 1-1.811-.75V16a1 1 0 0 0-1-1H5a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1z"
                                        fill="currentColor" />
                                </g>
                            </svg>
                        </div>
                        <div class="brake">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="9" fill="none" stroke="#fff" />
                                <circle cx="12" cy="12" r="9" class="brake-fill" fill="none" />
                                <rect x="8" y="12" rx="1" ry="1" width="8" height="4" fill="#fff" />
                                <line x1="16" y1="8" x2="13" y2="14" stroke="#fff" stroke-linecap="round" />
                            </svg>
                        </div>
                        <div class="accel">
                            <svg viewBox="0 0 24 24">
                                <defs>
                                    <clipPath id="accelClip">
                                        <rect x="3" y="3" width="18" height="18" id="accelFill" />
                                    </clipPath>
                                </defs>
                                <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" />
                                <circle cx="12" cy="12" r="9" class="accel-fill" clip-path="url(#accelClip)" />
                                <rect x="10" y="9" rx="1" ry="1" width="4" height="8" fill="currentColor" />
                                <line x1="12" y1="9" x2="12" y2="7" stroke="currentColor" stroke-linecap="round" />
                            </svg>
                        </div>
                    </div>
                </div>
                <div class="scrubber">
                    <button id="playBtn" title="Play/Pause" disabled>
                        <svg viewBox="0 0 24 24">
                            <polygon points="6,4 20,12 6,20" />
                        </svg>
                    </button>
                    <input type="range" id="slider" min="0" max="0" value="0" disabled>
                </div>
            </section>

            <aside class="meta-section">
                <div class="meta-panel">
                    <div class="meta-header">
                        <div class="filename" id="fileName">No file loaded</div>
                        <div class="framenum" id="frameNum">Frame 0/0</div>
                        <div class="recording-time" id="recordingTime">시간 정보 없음</div>
                    </div>
                    <div class="meta-list" id="metaList"></div>
                </div>
                <button class="export-btn" id="exportBtn" disabled>Export CSV</button>
            </aside>
        </main>
    </div>

    <script src="vendor/protobuf.min.js"></script>
    <script src="vendor/jszip.min.js"></script>
    <script src="dashcam-mp4.js"></script>
    <script src="viewer-clips.js"></script>
    <script src="viewer-ui.js"></script>
    <script src="viewer-player.js"></script>
    <script src="viewer-app.js"></script>
</body>

</html>
